<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Cam Map — 世界のライブカメラ地図（プロトタイプ）</title>
  <meta name="description" content="世界中のライブカメラを一枚の地図で。GitHub Pagesで公開できる静的サイトのプロトタイプ。">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="site-header">
    <div>
      <h1>🌏 Live Cam Map</h1>
      <p>いま、世界のどこかの「いま」をのぞく。</p>
    </div>
    <button id="randomBtn" class="primary" type="button">🎲 ランダムで旅する</button>
  </header>

  <div class="toolbar">
    <input id="searchInput" type="search" placeholder="場所・名前で検索（例：渋谷、富士山）" aria-label="検索">
    <nav id="categoryBar" class="chips" aria-label="カテゴリ"></nav>
    <span id="countLabel" class="count"></span>
  </div>

  <main class="layout">
    <section class="map-wrap" aria-label="地図">
      <div id="map"></div>
    </section>

    <aside class="side">
      <section id="playerPanel" class="player" aria-label="プレーヤー">
        <div class="player-empty">
          <p><strong>ピンをクリックすると、ここで映像が見られます。</strong></p>
          <p class="muted">左のリストから選んでもOK。YouTube公式の埋め込みプレーヤーで再生します。</p>
        </div>
      </section>
      <ul id="camList" class="cam-list"></ul>
    </aside>
  </main>

  <footer class="site-footer">
    地図のクレジットは地図右下に表示されます（種類ごとに自動で切り替わります） ・
    映像は YouTube 公式埋め込みで再生され、著作権は各チャンネルに帰属します ・
    サンプルデータは <code>data/cameras.json</code> を編集して差し替えできます
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="./app.js"></script>
</body>
</html>
